  <path d="M28 30 L28 170 L52 170 L52 110 L78 110 L106 170 L132 170 L102 108 C118 100 126 86 126 70 C126 46 108 30 84 30 Z M52 50 L82 50 C94 50 102 58 102 70 C102 82 94 90 82 90 L52 90 Z"
